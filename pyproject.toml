[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-system-one"
version = "0.1.0"
description = "A polished TUI for OpenAI answers and TypeSafe Jev decisions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "textual>=1.0.0",
  "typesafe-sdk>=0.1.0",
  "typer>=0.12.3"
]

[project.scripts]
jev = "jev_system_one.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_system_one"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
